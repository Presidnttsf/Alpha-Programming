<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input tutorial</title>
</head>
<body>
    <h1>Input Tutorial</h1>
    <input type="text" id="inp" placeholder="Enter your name" value="Tauseef" size="30" maxlength="50" required><br><br>
    <button type="button" onclick="showValue()">Show Value</button>
    <div id="output"></div>
    <script>
        function showValue() {
            const inputElement = document.querySelector('#inp');
            const outputDiv = document.getElementById("output");
            console.log("Input value is:", inputElement.value);
            outputDiv.textContent = "You entered: " + inputElement.value;
        
        }
        </script>
</body>
</html>
