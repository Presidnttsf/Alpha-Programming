<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List with loops</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<style>
ul {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    row-gap: 5px;
    column-gap: 10px;
    padding: 0;
    list-style: none;
}

</style>
<body>
    <h1>List of users</h1>
<div class="container">
<div id="loaderContainer"
     class="d-flex justify-content-center align-items-center"
     style="height: 100vh;">

    <div id="loader" class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>

</div>

<ul id="listCont"></ul>
</div>


<script>
const students = [
  { id: crypto.randomUUID(), name: "Tauseef", course: "Web Development" },
  { id: crypto.randomUUID(), name: "Komal", course: "Python" },
  { id: crypto.randomUUID(), name: "Rahul", course: "Data Analytics" },
  { id: crypto.randomUUID(), name: "Rahul", course: "Data Analytics" },
  { id: crypto.randomUUID(), name: "Rahul", course: "Data Analytics" },
  { id: crypto.randomUUID(), name: "Rahul", course: "Data Analytics" },
  { id: crypto.randomUUID(), name: "Rahul", course: "Data Analytics" },
  { id: crypto.randomUUID(), name: "Rahul", course: "Data Analytics" },
  { id: crypto.randomUUID(), name: "Rahul", course: "Data Analytics" },
  { id: crypto.randomUUID(), name: "Rahul", course: "Data Analytics" },
  { id: crypto.randomUUID(), name: "Rahul", course: "Data Analytics" },
];

const displayList = document.getElementById("listCont");
const loader = document.getElementById("loader");

setTimeout(() => {

    // Hide the spinner
     document.getElementById("loaderContainer").remove();

    // Display student cards
    for (let i = 0; i < students.length; i++) {
        let list = document.createElement("div");

        list.innerHTML = `
            <div class="card" style="width: 12rem; border: 2px solid red">
                <img src="https://picsum.photos/200?random=${i + 1}"
                     class="card-img-top" alt="img">

                <div class="card-body">
                    <h5 class="card-title">${students[i].name}</h5>
                    <p class="card-text">${students[i].course}</p>
                    <p class="card-text">
                        <strong>Id:</strong> ${students[i].id}
                    </p>
                </div>
            </div>
        `;

        displayList.appendChild(list);
    }

}, 2000); // Wait 2 seconds


</script>
</body>
</html>
