    <title>Oct 1 tut</title>
<style>
  .container {
    position: absolute;
    right: 0px;
    
    
}

.move {
    animation: moveImage 10s linear infinite alternate;
}

@keyframes moveImage {
    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(800px);
    }
}
</style>

</head>
<body>
    <h1>Oct 1 tut for paths</h1>
    <button style="margin-bottom: 10px;"  onclick="clickMe()">Click to move</button>

    <div id="clickMe" style="position: relative; left: 0px;">
<img src="./assets/images/batman-run.gif" style="width: 200px; height: 200px;">

</div>
